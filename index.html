    <!-- Confetti logic -->
    <script>
        function shootConfetti() {
            const canvas = document.createElement('canvas');
            canvas.style.position = 'fixed';
            canvas.style.top = '0';
            canvas.style.left = '0';
            canvas.style.width = '100vw';
            canvas.style.height = '100vh';
            canvas.style.pointerEvents = 'none';
            canvas.style.zIndex = '9999';
            document.body.appendChild(canvas);
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            const particles = [];
            const colors = ['#e94560', '#4ade80', '#fbbf24', '#0f3460'];

            for (let i = 0; i < 150; i++) {
                particles.push({
                    x: canvas.width / 2,
                    y: canvas.height / 2,
                    r: Math.random() * 6 + 2,
                    dx: Math.random() * 20 - 10,
                    dy: Math.random() * 20 - 10,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    life: 100
                });
            }

            function animate() {
                requestAnimationFrame(animate);
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                let alive = false;
                particles.forEach(p => {
                    if (p.life > 0) {
                        alive = true;
                        p.x += p.dx;
                        p.y += p.dy;
                        p.dy += 0.5; // gravity
                        p.life--;
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                        ctx.fillStyle = p.color;
                        ctx.fill();
                    }
                });
                if (!alive) {
                    canvas.remove();
                }
            }
            animate();
        }

        function useLocalStorage(key, initialValue) {
            const [storedValue, setStoredValue] = React.useState(() => {
                try {
                    const item = window.localStorage.getItem(key);
                    return item ? JSON.parse(item) : initialValue;
                } catch (error) {
                    console.log(error);
                    return initialValue;
                }
            });

            const setValue = (value) => {
                try {
                    const valueToStore = value instanceof Function ? value(storedValue) : value;
                    setStoredValue(valueToStore);
                    window.localStorage.setItem(key, JSON.stringify(valueToStore));
                } catch (error) {
                    console.log(error);
                }
            };
            return [storedValue, setValue];
        }

            const submitQuiz = () => {
                if (quizState.answer === null) return;
                if (quizState.answer === selectedNode.quiz.a) {
                    // Success
                    if (!user.completedNodes.includes(selectedNode.id)) {
                        awardDP(20);
                        const newCompleted = [...user.completedNodes, selectedNode.id];
                        user.completedNodes = newCompleted; // Will be synced via context
                        addToast(`Node completed! +20 DP`, 'success');
                        
                        if (selectedNode.id === 7) awardBadge('Voter Ink');
                        if (selectedNode.id === 10) {

                    setSelectedNode(null);

        // 3. Quiz Arena

            const [flipped, setFlipped] = React.useState(false);

            const startModeA = () => {
                setMode('A');
                setCurrentQ(0);
                setScore(0);
                setFinished(false);

                if (selectedIdx === QUIZ_BANK[currentQ].a) {

                if (currentQ < QUIZ_BANK.length - 1) {

                    awardDP(25);

            const steps = [
                { title: "Arrival", desc: "Welcome to the Polling Booth. Please wait in line.", emoji: "🚶‍♂️" },

                { title: "Register", desc: "Sign the register and receive your voting slip.", emoji: "✍️" },
                { title: "Booth Entry", desc: "Hand slip to Third Officer and proceed to the compartment.", emoji: "🚪" },
                { title: "EVM Voting", desc: "Press the blue button next to your chosen candidate. Wait for the beep.", emoji: "📠" },
                { title: "VVPAT", desc: "Check the printed slip in the VVPAT window for 7 seconds.", emoji: "🧾" }

            const nextStep = () => {

                        // Play beep
                        const ctx = new (window.AudioContext || window.webkitAudioContext)();
                        const osc = ctx.createOscillator();
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(800, ctx.currentTime);
                        osc.connect(ctx.destination);
                        osc.start();
                        osc.stop(ctx.currentTime + 0.5);

                    setStep(s => s + 1);

                                <div className="mt-8 bg-surface p-4 rounded-xl border border-white/5 inline-block text-left w-64">

                        {step !== 5 && (
                            <div className="flex justify-end mt-4">
                                <button onClick={nextStep} className="px-8 py-3 bg-accent2 hover:bg-opacity-80 text-white rounded-lg font-bold transition">
                                    {step === steps.length - 1 ? 'Finish' : 'Next Step'}
                                </button>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        // 5. Compare Tool
        const CompareTool = () => {
            const { awardBadge } = React.useContext(UserContext);
            const [selectedComp, setSelectedComp] = React.useState(Object.keys(COMPARE_DATA)[0]);

            React.useEffect(() => {
                // Tracking usage for badge could go here
                awardBadge('Compare Expert');
            }, []);

            const data = COMPARE_DATA[selectedComp];
            const parts = selectedComp.split(' vs ');

            return (
                <div className="fade-in">
                     <div className="mb-8 flex justify-between items-end">
                        <div>
                            <h2 className="text-3xl font-bold mb-2">Compare Systems</h2>
                            <p className="text-textMuted">Understand differences between democratic structures.</p>
                        </div>
                        <select 
                            className="bg-surface border border-white/10 rounded-lg px-4 py-2 text-white outline-none"
                            value={selectedComp}
                            onChange={(e) => setSelectedComp(e.target.value)}
                        >
                            {Object.keys(COMPARE_DATA).map(k => <option key={k} value={k}>{k}</option>)}
                        </select>
                    </div>

                    <div className="glass-card overflow-hidden">
                        <div className="grid grid-cols-3 bg-surface p-4 font-bold border-b border-white/10 text-center">
                            <div className="text-left text-textMuted uppercase tracking-wider text-xs">Feature</div>
                            <div className="text-accent2 text-lg">{parts[0]}</div>
                            <div className="text-accent1 text-lg">{parts[1]}</div>
                        </div>
                        
                        {data.map((row, idx) => (
                            <div key={idx} className="grid grid-cols-3 p-4 border-b border-white/5 hover:bg-white/5 transition">
                                <div className="font-medium text-textMuted flex items-center">{row.category}</div>
                                <div className={`text-center p-2 rounded ${row.highlight === 1 ? 'bg-success/10 text-success' : ''}`}>{row.p1}</div>
                                <div className={`text-center p-2 rounded ${row.highlight === 2 ? 'bg-success/10 text-success' : ''}`}>{row.p2}</div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        };

        // 6. AI Chatbot
        const Chatbot = () => {
            const { awardBadge } = React.useContext(UserContext);
            const [messages, setMessages] = React.useState([{ role: 'assistant', content: 'Namaste! I am ElectionBot. Ask me anything about Indian elections, voting rights, or the Constitution!' }]);
            const [input, setInput] = React.useState('');
            const [loading, setLoading] = React.useState(false);
            const chatEndRef = React.useRef(null);

            const scrollToBottom = () => {
                chatEndRef.current?.scrollIntoView({ behavior: "smooth" });
            };

            React.useEffect(scrollToBottom, [messages]);

            const sendMessage = async (text) => {
                const msg = text || input;
                if (!msg.trim()) return;

                const newMsgs = [...messages, { role: 'user', content: msg }];
                setMessages(newMsgs);
                setInput('');
                setLoading(true);

                if (newMsgs.filter(m => m.role === 'user').length === 10) {
                    awardBadge('AI Curious');
                }

                try {
                    // MOCK RESPONSE IF API KEY NOT SET
                    if (ANTIGRAVITY_API_KEY === "YOUR_API_KEY_HERE") {
                        setTimeout(() => {
                            setMessages([...newMsgs, { role: 'assistant', content: `[Mock API Response] You asked: "${msg}". Please add your Antigravity API key in the source code to enable real AI responses.` }]);
                            setLoading(false);
                        }, 1000);
                        return;
                    }

                    const response = await fetch(API_URL, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${ANTIGRAVITY_API_KEY}`
                        },
                        body: JSON.stringify({
                            model: "gemini-1.5-pro", // Or equivalent depending on provider
                            messages: [
                                { role: 'system', content: "You are ElectionBot, an expert on Indian elections, the Constitution, ECI, voting rights. Explain clearly for students. Keep under 100 words." },
                                ...newMsgs
                            ]
                        })
                    });
                    
                    const data = await response.json();
                    setMessages([...newMsgs, { role: 'assistant', content: data.choices[0].message.content }]);
                } catch (error) {
                    console.error(error);
                    setMessages([...newMsgs, { role: 'assistant', content: "Sorry, I'm having trouble connecting to my servers right now." }]);
                } finally {
                    setLoading(false);
                }
            };

            return (
                <div className="fade-in h-[calc(100vh-120px)] flex flex-col">
                    <div className="mb-4">
                        <h2 className="text-3xl font-bold">ElectionBot AI</h2>
                    </div>

                    <div className="glass-card flex-1 flex flex-col overflow-hidden relative">
                        <div className="flex-1 p-6 overflow-y-auto custom-scrollbar space-y-4">
                            {messages.map((m, i) => (
                                <div key={i} className={`flex ${m.role === 'user' ? 'justify-end' : 'justify-start'}`}>
                                    <div className={`max-w-[80%] p-4 rounded-2xl ${m.role === 'user' ? 'bg-accent2 text-white rounded-br-sm' : 'bg-surface border border-white/5 text-textPrimary rounded-bl-sm'}`}>
                                        {m.content}
                                    </div>
                                </div>
                            ))}
                            {loading && (
                                <div className="flex justify-start">
                                    <div className="bg-surface p-4 rounded-2xl rounded-bl-sm flex gap-2 items-center">
                                        <div className="w-2 h-2 bg-textMuted rounded-full animate-bounce"></div>
                                        <div className="w-2 h-2 bg-textMuted rounded-full animate-bounce" style={{ animationDelay: '0.2s' }}></div>
                                        <div className="w-2 h-2 bg-textMuted rounded-full animate-bounce" style={{ animationDelay: '0.4s' }}></div>
                                    </div>
                                </div>
                            )}
                            <div ref={chatEndRef} />
                        </div>
                        
                        {messages.length === 1 && (
                            <div className="absolute bottom-20 left-0 w-full px-6 flex flex-wrap gap-2">
                                {["What is EVM?", "Who is the Chief Election Commissioner?", "Difference between MP and MLA"].map((q, i) => (
                                    <button key={i} onClick={() => sendMessage(q)} className="text-xs bg-surface border border-white/10 hover:border-accent2 px-3 py-1.5 rounded-full transition">{q}</button>
                                ))}
                            </div>
                        )}

                        <div className="p-4 bg-surface border-t border-white/5 flex gap-2">
                            <input 
                                type="text" 
                                value={input}
                                onChange={(e) => setInput(e.target.value)}
                                onKeyPress={(e) => e.key === 'Enter' && sendMessage()}
                                placeholder="Ask about elections..." 
                                className="flex-1 bg-[#1a1a2e] border border-white/10 rounded-lg px-4 py-2 outline-none focus:border-accent2 transition"
                            />
                            <button onClick={() => sendMessage()} className="bg-accent2 hover:bg-opacity-80 px-4 rounded-lg transition text-white">Send</button>
                        </div>
                    </div>
                </div>
            );
        };

        // ----------------------------------------------------------------------
        // MAIN APP COMPONENT
        // ----------------------------------------------------------------------
        const App = () => {
            const [view, setView] = React.useState('Dashboard');
            const [isMobileMenuOpen, setMobileMenuOpen] = React.useState(false);
            const [toasts, setToasts] = React.useState([]);
            const [showBadgeModal, setShowBadgeModal] = React.useState(null);
            
            // Theme State
            const [theme, setTheme] = useLocalStorage('nirmaanx_theme', 'C');
            const [showThemeMenu, setShowThemeMenu] = React.useState(false);
            const THEMES = [
                { id: 'C', name: 'Cream + Olive', color: '#5a6e35' },
                { id: 'A', name: 'Warm Parchment', color: '#e8c84a' },
                { id: 'B', name: 'Stark Yellow Dark', color: '#f5e642' },
                { id: 'D', name: 'Midnight Blue', color: '#1f6feb' },
                { id: 'E', name: 'Saffron + Ivory', color: '#c0392b' },
                { id: 'F', name: 'Catppuccin Mocha', color: '#cba6f7' }
            ];

            React.useEffect(() => {
                document.documentElement.setAttribute('data-theme', theme);
            }, [theme]);

            // User State Initialization
            const [user, setUser] = useLocalStorage('nirmaanx_user', {
                uid: 'local_user_' + Date.now(),
                name: 'Student',
                dp: 0,
                rank: RANKS[0].name,
                badges: [],
                completedNodes: [],
                quizScores: [],
                streakDays: 1,
                lastLogin: new Date().toDateString()
            });

            // Logic to handle DP and Rank updates
            const calculateRank = (dp) => {
                const rank = RANKS.slice().reverse().find(r => dp >= r.min);
                return rank ? rank.name : RANKS[0].name;
            };

            const awardDP = (points) => {
                setUser(prev => {
                    const newDp = prev.dp + points;
                    return { ...prev, dp: newDp, rank: calculateRank(newDp) };
                });
            };

            const awardBadge = (badgeName) => {
                setUser(prev => {
                    if (!prev.badges.includes(badgeName)) {
                        setShowBadgeModal({ name: badgeName });
                        return { ...prev, badges: [...prev.badges, badgeName] };
                    }
                    return prev;
                });
            };

            const addToast = (message, type = 'info') => {
                const id = Date.now();
                setToasts(prev => [...prev, { id, message, type }]);
                setTimeout(() => {
                    setToasts(prev => prev.filter(t => t.id !== id));
                }, 3000);
            };

            const navItems = [
                { id: 'Dashboard', icon: Icons.Home },
                { id: 'Timeline', icon: Icons.Timeline },
                { id: 'Quiz', icon: Icons.Quiz },
                { id: 'Simulator', icon: Icons.Vote },
                { id: 'Compare', icon: Icons.Compare },
                { id: 'Chatbot', icon: Icons.Chat }
            ];

            return (
                <UserContext.Provider value={{ user, awardDP, awardBadge }}>
                <ToastContext.Provider value={{ addToast }}>
                    <div className="flex h-screen overflow-hidden bg-primary text-textPrimary">
                        
                        {/* Sidebar */}
                        <div className={`fixed md:static inset-y-0 left-0 z-40 w-64 glass-panel transform ${isMobileMenuOpen ? 'translate-x-0' : '-translate-x-full'} md:translate-x-0 transition duration-300 ease-in-out flex flex-col`}>
                            <div className="p-6 flex items-center gap-3">
                                <div className="w-10 h-10 bg-accent2 rounded-lg flex items-center justify-center text-xl shadow-[0_0_15px_rgba(233,69,96,0.5)]">🇮🇳</div>
                                <h1 className="text-xl font-bold tracking-tight text-white">NirmaanX</h1>
                            </div>
                            
                            <nav className="flex-1 px-4 space-y-2 mt-4">
                                {navItems.map(item => (
                                    <button 
                                        key={item.id}
                                        onClick={() => { setView(item.id); setMobileMenuOpen(false); }}
                                        className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl transition ${view === item.id ? 'bg-accent2/20 text-accent2 font-semibold border border-accent2/30' : 'text-textMuted hover:bg-white/5 hover:text-white'}`}
                                    >
                                        <item.icon />
                                        {item.id}
                                    </button>
                                ))}
                            </nav>
                            
                            <div className="p-6 border-t border-white/5">
                                <div className="text-xs text-textMuted text-center">Version 1.0 (Standalone)</div>
                            </div>
                        </div>

                        {/* Main Content */}
                        <div className="flex-1 flex flex-col overflow-hidden relative z-10">
                            
                            {/* Topbar */}
                            <header className="h-20 border-b border-white/5 bg-primary/80 backdrop-blur-md flex items-center justify-between px-6 z-20">
                                <button className="md:hidden text-white" onClick={() => setMobileMenuOpen(true)}>
                                    <Icons.Menu />
                                </button>
                                
                                <div className="hidden md:block font-medium text-textMuted">
                                    {new Date().toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' })}
                                </div>

                                <div className="flex items-center gap-4 md:gap-6">
                                    <div className="hidden sm:flex items-center gap-2 bg-surface px-4 py-2 rounded-full border border-white/10 cursor-help" title="Democracy Points">
                                        <span className="text-success font-bold">{user.dp}</span>
                                        <span className="text-xs text-textMuted">DP</span>
                                    </div>
                                    <div className="hidden sm:flex items-center gap-2 bg-surface px-4 py-2 rounded-full border border-white/10 cursor-help">
                                        <div className="w-2 h-2 bg-accent2 rounded-full animate-pulse"></div>
                                        <span className="text-xs font-semibold">{user.rank}</span>
                                    </div>
                                    
                                    <div className="relative">
                                        <button 
                                            onClick={() => setShowThemeMenu(!showThemeMenu)}
                                            className="text-textMuted hover:text-white transition p-2 rounded-full hover:bg-white/5"
                                            title="Change Theme"
                                        >
                                            <Icons.Palette />
                                        </button>
                                        
                                        {showThemeMenu && (
                                            <div className="absolute right-0 mt-2 w-48 bg-surface border border-white/10 rounded-xl shadow-2xl py-2 z-50 animate-[slideIn_0.2s_ease-out]">
                                                <div className="px-4 py-2 text-xs font-bold text-textMuted uppercase tracking-wider border-b border-white/5 mb-2">Select Theme</div>
                                                {THEMES.map(t => (
                                                    <button 
                                                        key={t.id}
                                                        onClick={() => { setTheme(t.id); setShowThemeMenu(false); }}
                                                        className={`w-full flex items-center gap-3 px-4 py-2 hover:bg-white/5 transition text-left text-sm ${theme === t.id ? 'text-accent2 font-bold' : 'text-textPrimary'}`}
                                                    >
                                                        <span className="w-4 h-4 rounded-full border border-white/20 flex-shrink-0" style={{ backgroundColor: t.color }}></span>
                                                        {t.name}
                                                        {theme === t.id && <span className="ml-auto">✓</span>}
                                                    </button>
                                                ))}
                                            </div>
                                        )}
                                    </div>

                                    <button className="relative text-textMuted hover:text-white transition p-2 rounded-full hover:bg-white/5">
                                        <Icons.Bell />
                                        <span className="absolute top-1 right-1 w-2.5 h-2.5 bg-accent2 rounded-full border-2 border-primary"></span>
                                    </button>
                                    <div className="w-10 h-10 rounded-full bg-gradient-to-r from-accent1 to-accent2 flex items-center justify-center font-bold border-2 border-white/10">
                                        {user.name.charAt(0)}
                                    </div>
                                </div>
                            </header>

                            {/* View Container */}
                            <main className="flex-1 overflow-x-hidden overflow-y-auto bg-primary p-6 md:p-10 custom-scrollbar relative">
                                {/* Decorative background elements */}
                                <div className="absolute top-0 left-1/4 w-96 h-96 bg-accent1/10 rounded-full blur-3xl pointer-events-none"></div>
                                <div className="absolute bottom-0 right-1/4 w-96 h-96 bg-accent2/10 rounded-full blur-3xl pointer-events-none"></div>
                                
                                <div className="relative z-10 max-w-6xl mx-auto">
                                    {view === 'Dashboard' && <HomeDashboard changeView={setView} />}
                                    {view === 'Timeline' && <Timeline />}
                                    {view === 'Quiz' && <QuizArena />}
                                    {view === 'Simulator' && <Simulator />}
                                    {view === 'Compare' && <CompareTool />}
                                    {view === 'Chatbot' && <Chatbot />}
                                </div>
                            </main>
                        </div>

                        {/* Overlay for mobile menu */}
                        {isMobileMenuOpen && (
                            <div 
                                className="fixed inset-0 bg-black/50 z-30 md:hidden"
                                onClick={() => setMobileMenuOpen(false)}
                            ></div>
                        )}
                        
                        <ToastManager toasts={toasts} />
                        {showBadgeModal && <AchievementModal badge={showBadgeModal} onClose={() => setShowBadgeModal(null)} />}
                    </div>
                </ToastContext.Provider>
                </UserContext.Provider>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
